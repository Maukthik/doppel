<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#818b98"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="aH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <g id="user"><circle cx="0" cy="-5" r="4.5"/><path d="M-8,8 a8,7 0 0 1 16,0 z"/></g>
  </defs>

  <rect x="1" y="1" width="1598" height="698" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="2"/>

  <text x="60" y="84" font-size="30" font-weight="700" fill="#1f2328">Reviewers read a pull request. Doppel runs it.</text>
  <text x="60" y="116" font-size="19" fill="#59636e">The same users go through your app before and after the change; every difference is recorded and judged.</text>

  <g transform="translate(0,-80)">
  <!-- inputs -->
  <rect x="60" y="288" width="210" height="84" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="165" y="324" font-size="20" font-weight="600" fill="#1f2328" text-anchor="middle">main branch</text>
  <text x="165" y="350" font-size="14" fill="#59636e" text-anchor="middle">your app as it is</text>

  <rect x="60" y="534" width="210" height="84" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="165" y="570" font-size="20" font-weight="600" fill="#1f2328" text-anchor="middle">pull request</text>
  <text x="165" y="596" font-size="14" fill="#59636e" text-anchor="middle">the change + its description</text>

  <!-- sandboxes -->
  <rect x="320" y="226" width="640" height="414" rx="14" fill="#ffffff" stroke="#b7c0ca" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="344" y="258" font-size="13" font-weight="600" fill="#59636e" letter-spacing="1.2">NEBIUS TOKEN FACTORY SANDBOXES</text>

  <g transform="translate(445,306)">
    <path d="M-78,0 V48 a78,12 0 0 0 156,0 V0" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="78" ry="12" fill="#eef1f4" stroke="#d1d9e0" stroke-width="1.5"/>
    <text x="0" y="36" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">twin of the app</text>
    <text x="0" y="82" font-size="13" fill="#59636e" text-anchor="middle">app + data, seeded once</text>
  </g>
  <line x1="272" y1="330" x2="360" y2="330" stroke="#818b98" stroke-width="2" marker-end="url(#a)"/>

  <rect x="640" y="288" width="260" height="84" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="770" y="324" font-size="19" font-weight="700" fill="#0969da" text-anchor="middle">Base world</text>
  <text x="770" y="350" font-size="14" fill="#59636e" text-anchor="middle">before the change</text>

  <rect x="640" y="534" width="260" height="84" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="770" y="570" font-size="19" font-weight="700" fill="#8250df" text-anchor="middle">Head world</text>
  <text x="770" y="596" font-size="14" fill="#59636e" text-anchor="middle">after the change</text>

  <line x1="526" y1="330" x2="632" y2="330" stroke="#0969da" stroke-width="2" marker-end="url(#aB)"/>
  <text x="578" y="320" font-size="13" fill="#59636e" text-anchor="middle">fork</text>
  <path d="M526,348 C590,348 580,560 632,560" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#aH)"/>
  <text x="560" y="470" font-size="13" fill="#59636e" text-anchor="end">fork</text>
  <line x1="272" y1="592" x2="632" y2="592" stroke="#8250df" stroke-width="2" marker-end="url(#aH)"/>
  <text x="452" y="614" font-size="13" fill="#59636e" text-anchor="middle">+ the PR's code</text>

  <rect x="650" y="414" width="240" height="66" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <g fill="#1a7f37"><use href="#user" x="674" y="449"/><use href="#user" x="695" y="449"/><use href="#user" x="716" y="449"/></g>
  <text x="736" y="442" font-size="16" font-weight="600" fill="#1f2328">Same users in both</text>
  <text x="736" y="464" font-size="13" fill="#59636e">your tests + Nemotron</text>
  <line x1="770" y1="412" x2="770" y2="382" stroke="#1a7f37" stroke-width="2" marker-end="url(#aG)"/>
  <line x1="770" y1="482" x2="770" y2="524" stroke="#1a7f37" stroke-width="2" marker-end="url(#aG)"/>

  <!-- compare -->
  <path d="M902,330 C975,330 975,432 1004,437" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#aB)"/>
  <path d="M902,576 C975,576 975,450 1004,445" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#aH)"/>
  <rect x="1012" y="399" width="176" height="84" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="1100" y="435" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle">compare</text>
  <text x="1100" y="461" font-size="14" fill="#59636e" text-anchor="middle">every response</text>

  <!-- judge + output -->
  <path d="M1190,441 H1214 V330 H1236" fill="none" stroke="#818b98" stroke-width="2" marker-end="url(#a)"/>
  <rect x="1244" y="288" width="296" height="84" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="1392" y="322" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle">Nemotron judge</text>
  <text x="1392" y="348" font-size="14" fill="#59636e" text-anchor="middle">did the PR mean this change?</text>

  <line x1="1392" y1="374" x2="1392" y2="526" stroke="#818b98" stroke-width="2" marker-end="url(#a)"/>
  <text x="1404" y="455" font-size="13" fill="#59636e">no → regression</text>

  <rect x="1244" y="534" width="296" height="84" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <circle cx="1276" cy="576" r="12" fill="#cf222e"/><path d="M1270.5,570.5 l11,11 M1281.5,570.5 l-11,11" stroke="#ffebe9" stroke-width="2.6"/>
  <text x="1300" y="570" font-size="19" font-weight="600" fill="#1f2328">PR comment + check</text>
  <text x="1300" y="596" font-size="14" fill="#59636e">regression, old vs new value</text>
  </g>

  <!-- result -->
  <line x1="60" y1="602" x2="1540" y2="602" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="800" y="648" font-size="18" fill="#59636e" text-anchor="middle">On 30 real pull requests:  tests <tspan font-weight="600" fill="#1f2328">12/20</tspan>   ·   AI review <tspan font-weight="600" fill="#1f2328">17/20</tspan>   ·   Doppel <tspan font-weight="600" fill="#1f2328">16/20, 0 false alarms</tspan>   ·   tests + Doppel <tspan font-weight="700" fill="#1a7f37">20/20</tspan></text>
</svg>
