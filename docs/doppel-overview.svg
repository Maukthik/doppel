<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 724" width="1600" height="724" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131b33"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#c58cff"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7aa3"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="aH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#76b900"/>
    </marker>
    <g id="user"><circle cx="0" cy="-5" r="4.5"/><path d="M-8,8 a8,7 0 0 1 16,0 z"/></g>
  </defs>

  <rect width="1600" height="724" rx="24" fill="url(#bg)"/>

  <!-- Header -->
  <text x="60" y="96" font-size="58" font-weight="800" fill="url(#brand)">Doppel</text>
  <text x="300" y="78" font-size="28" font-weight="700" fill="#e6edf3">Reviewers read a pull request. Doppel runs it.</text>
  <text x="300" y="110" font-size="19" fill="#9aa6c4">Same users, the app before and after the change, every difference proven and judged.</text>

  <g transform="translate(0,-56)">
  <!-- ===== Inputs ===== -->
  <rect x="60" y="288" width="210" height="84" rx="14" fill="#16233a" stroke="#2f5d95" stroke-width="1.5"/>
  <text x="165" y="324" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="middle">main branch</text>
  <text x="165" y="350" font-size="14" fill="#9aa6c4" text-anchor="middle">your app as it is</text>

  <rect x="60" y="534" width="210" height="84" rx="14" fill="#211a38" stroke="#6b4f9e" stroke-width="1.5"/>
  <text x="165" y="570" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="middle">pull request</text>
  <text x="165" y="596" font-size="14" fill="#9aa6c4" text-anchor="middle">the change + its description</text>

  <!-- ===== Nebius sandboxes ===== -->
  <rect x="320" y="226" width="640" height="414" rx="20" fill="#111a30" stroke="#3a4670" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="344" y="258" font-size="14" font-weight="700" fill="#a99bff" letter-spacing="1.2">NEBIUS TOKEN FACTORY SANDBOXES</text>

  <g transform="translate(445,306)">
    <ellipse cx="0" cy="0" rx="78" ry="12" fill="#2a3557"/>
    <rect x="-78" y="0" width="156" height="48" fill="#222c4a"/>
    <path d="M-78,0 V48 M78,0 V48" stroke="#56628a"/>
    <path d="M-78,48 a78,12 0 0 0 156,0" fill="#222c4a" stroke="#56628a"/>
    <ellipse cx="0" cy="0" rx="78" ry="12" fill="none" stroke="#56628a"/>
    <text x="0" y="30" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">twin of the app</text>
    <text x="0" y="82" font-size="13" fill="#9aa6c4" text-anchor="middle">app + data, seeded once</text>
  </g>
  <line x1="272" y1="330" x2="360" y2="330" stroke="#6b7aa3" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="640" y="288" width="260" height="84" rx="14" fill="#0f1d33" stroke="#58a6ff" stroke-width="2"/>
  <text x="770" y="324" font-size="19" font-weight="800" fill="#58a6ff" text-anchor="middle">BASE WORLD</text>
  <text x="770" y="350" font-size="14" fill="#9aa6c4" text-anchor="middle">before the change</text>

  <rect x="640" y="534" width="260" height="84" rx="14" fill="#1b1533" stroke="#bc8cff" stroke-width="2"/>
  <text x="770" y="570" font-size="19" font-weight="800" fill="#bc8cff" text-anchor="middle">HEAD WORLD</text>
  <text x="770" y="596" font-size="14" fill="#9aa6c4" text-anchor="middle">after the change</text>

  <line x1="526" y1="330" x2="632" y2="330" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="578" y="320" font-size="13" fill="#9aa6c4" text-anchor="middle">fork</text>
  <path d="M526,348 C590,348 580,560 632,560" fill="none" stroke="#bc8cff" stroke-width="2.5" marker-end="url(#aH)"/>
  <text x="560" y="470" font-size="13" fill="#9aa6c4" text-anchor="end">fork</text>
  <line x1="272" y1="592" x2="632" y2="592" stroke="#bc8cff" stroke-width="2.5" marker-end="url(#aH)"/>
  <text x="452" y="614" font-size="13" fill="#9aa6c4" text-anchor="middle">+ the PR's code</text>

  <!-- users, between the worlds -->
  <rect x="650" y="414" width="240" height="66" rx="14" fill="#18240a" stroke="#4d7a00" stroke-width="1.5"/>
  <g fill="#9fdc3a"><use href="#user" x="674" y="449"/><use href="#user" x="695" y="449"/><use href="#user" x="716" y="449"/></g>
  <text x="736" y="442" font-size="16" font-weight="700" fill="#e6edf3">Same users in both</text>
  <text x="736" y="464" font-size="13" fill="#9aa6c4">your tests + Nemotron</text>
  <line x1="770" y1="412" x2="770" y2="382" stroke="#76b900" stroke-width="2.5" marker-end="url(#aG)"/>
  <line x1="770" y1="482" x2="770" y2="524" stroke="#76b900" stroke-width="2.5" marker-end="url(#aG)"/>

  <!-- ===== Compare ===== -->
  <path d="M902,330 C975,330 975,432 1004,437" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#aB)"/>
  <path d="M902,576 C975,576 975,450 1004,445" fill="none" stroke="#bc8cff" stroke-width="2.5" marker-end="url(#aH)"/>
  <rect x="1012" y="399" width="176" height="84" rx="14" fill="#1c2540" stroke="#56628a" stroke-width="1.5"/>
  <text x="1100" y="435" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">compare</text>
  <text x="1100" y="461" font-size="14" fill="#9aa6c4" text-anchor="middle">every response</text>

  <!-- ===== Judge + output ===== -->
  <path d="M1190,441 H1214 V330 H1236" fill="none" stroke="#6b7aa3" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="1244" y="288" width="296" height="84" rx="14" fill="#18240a" stroke="#4d7a00" stroke-width="1.5"/>
  <text x="1392" y="322" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Nemotron judge</text>
  <text x="1392" y="348" font-size="14" fill="#9aa6c4" text-anchor="middle">did the PR mean this change?</text>

  <line x1="1392" y1="374" x2="1392" y2="526" stroke="#6b7aa3" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1404" y="455" font-size="13" fill="#9aa6c4">no → regression</text>

  <rect x="1244" y="534" width="296" height="84" rx="14" fill="#2a1418" stroke="#f85149" stroke-width="1.5"/>
  <circle cx="1276" cy="576" r="13" fill="#f85149"/><path d="M1270,570 l12,12 M1282,570 l-12,12" stroke="#2a1418" stroke-width="3"/>
  <text x="1300" y="570" font-size="19" font-weight="700" fill="#e6edf3">PR comment + check</text>
  <text x="1300" y="596" font-size="14" fill="#9aa6c4">regression, old vs new value</text>

  <!-- ===== Result band ===== -->
  <rect x="60" y="676" width="1480" height="62" rx="14" fill="#111a30" stroke="#26304d"/>
  <text x="800" y="715" font-size="18" fill="#9aa6c4" text-anchor="middle">On 30 pull requests to a real app:  tests <tspan font-weight="700" fill="#e6edf3">12/20</tspan>   ·   AI review <tspan font-weight="700" fill="#e6edf3">17/20</tspan>   ·   Doppel <tspan font-weight="700" fill="#e6edf3">17/20, 2 false alarms</tspan>   ·   tests + Doppel <tspan font-weight="800" fill="#3fb950">20/20</tspan></text>
  </g>
</svg>
