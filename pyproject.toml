[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doppel"
version = "0.1.0"
description = "A twin of your app that tries every pull request first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maukthik" }]
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
nebius = ["contree-sdk>=0.3.6", "openai>=1.40"]
dev = ["pytest>=8", "ruff>=0.5", "pyyaml>=6"]

[project.scripts]
doppel = "doppel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["bench/.cache", "bench/init"]  # seed scripts for other apps, kept as init wrote them

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/doppel/viewer.py" = ["E501"]  # the page's HTML, CSS and JS live in one string
