[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doppel-check"   # "doppel" on PyPI is an unrelated package; the command is still `doppel`
version = "1.0.0"
description = "A GitHub check that runs every pull request against the main branch and proves each regression."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maukthik" }]
dependencies = ["python-dotenv>=1.0", "pyyaml>=6"]   # pyyaml: the CI test job is parsed, not grepped

[project.optional-dependencies]
nebius = ["contree-sdk>=0.3.6", "openai>=1.40"]
dev = ["pytest>=8", "ruff>=0.5", "pyyaml>=6", "flask>=3", "django>=5", "fastapi>=0.110", "python-multipart>=0.0.9", "requests>=2", "httpx>=0.24",
       "tornado>=6", "aiohttp>=3.8", "webtest>=3", "falcon>=3"]  # frameworks and clients: probe/test-mode tests

[project.scripts]
doppel = "doppel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["bench/.cache", "bench/init", "bench/apps/*/generated"]  # setups kept exactly as init wrote them

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/doppel/viewer.py" = ["E501"]  # the page's HTML, CSS and JS live in one string
"src/doppel/site.py" = ["E501"]  # the index page's HTML and CSS live in strings
"src/doppel/checkview.py" = ["E501"]  # the check page's HTML and CSS live in strings
"bench/fresh_apps.py" = ["E501"]  # the results page's HTML and CSS live in strings
