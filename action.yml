name: Doppel
description: Runs your tests and a twin of your app on every pull request, before and after, and comments with the regressions it proves.
author: Maukthik
branding:
  icon: copy
  color: purple

inputs:
  app-dir:
    description: Folder of the app inside the repo (holds doppel.toml)
    default: "."
  personas:
    description: Personas JSON inside app-dir, read from the base branch (a PR can't pick its own testers). If the file doesn't exist there, Nemotron generates personas.
    default: "doppel-personas.json"
  personas-count:
    description: How many personas Nemotron generates when there is no personas file
    default: "12"
  judge:
    description: Let Nemotron Ultra label each change intended / regression using the PR description
    default: "true"
  guided:
    description: Let Nemotron Ultra list suspected regressions first; probe personas prove or refute each one
    default: "true"
  publish-page:
    description: "true = publish the check page to this repo's GitHub Pages (gh-pages branch) and link it from the comment"
    default: "true"
  twin:
    description: "auto = also run the guided twin when the repo has a doppel.toml; off = test mode only"
    default: "auto"
  fail-on-regression:
    description: Fail the check when the judge finds a regression
    default: "true"
  accept-label:
    description: "A maintainer adds this label and re-runs the check to accept Doppel's findings: the check passes and the comment still lists them. Only people who can label the PR (triage access or more) can do this"
    default: "doppel: accepted"
  fail-on-error:
    description: "true = fail the check when Doppel couldn't compare the two versions (the app didn't install, no test ran, ...); false = pass with a warning and the reason in the comment"
    default: "false"
  nebius-api-key:
    description: Nebius Token Factory API key (store it as a repository secret)
    required: true
  nebius-project-id:
    description: Nebius project ID (needed for sandboxes)
    required: true
  github-token:
    description: Token used to post the PR comment
    default: ${{ github.token }}

outputs:
  exit-code:
    description: "0 = no regressions, 1 = regressions found"
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Check out base (the branch the PR merges into)
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: .doppel/base
    - name: Check out head (the PR)
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: .doppel/head
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install Doppel
      shell: bash
      run: pip install --quiet "${{ github.action_path }}[nebius]"
    - name: Run Doppel
      id: run
      shell: bash
      env:
        NEBIUS_API_KEY: ${{ inputs.nebius-api-key }}
        NEBIUS_PROJECT_ID: ${{ inputs.nebius-project-id }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        set +e
        # pasted secrets often carry a trailing newline or space, which HTTP headers reject
        NEBIUS_API_KEY="$(printf '%s' "$NEBIUS_API_KEY" | tr -d '[:space:]')"
        NEBIUS_PROJECT_ID="$(printf '%s' "$NEBIUS_PROJECT_ID" | tr -d '[:space:]')"
        # ...and people paste the whole .env line: drop a leading NAME= and surrounding quotes
        NEBIUS_API_KEY="${NEBIUS_API_KEY#NEBIUS_API_KEY=}"; NEBIUS_PROJECT_ID="${NEBIUS_PROJECT_ID#NEBIUS_PROJECT_ID=}"
        NEBIUS_API_KEY="${NEBIUS_API_KEY//\"/}"; NEBIUS_API_KEY="${NEBIUS_API_KEY//\'/}"
        NEBIUS_PROJECT_ID="${NEBIUS_PROJECT_ID//\"/}"; NEBIUS_PROJECT_ID="${NEBIUS_PROJECT_ID//\'/}"
        export NEBIUS_API_KEY NEBIUS_PROJECT_ID
        echo "nebius-api-key: ${#NEBIUS_API_KEY} characters | nebius-project-id: ${#NEBIUS_PROJECT_ID} characters"
        # show only the unusual characters (not letters, digits, . _ -) so a bad paste is visible without leaking the value
        for v in NEBIUS_API_KEY NEBIUS_PROJECT_ID; do
          odd="$(printf '%s' "${!v}" | LC_ALL=C tr -d 'A-Za-z0-9._-' | od -An -c | tr -s ' ')"
          echo "$v unusual characters: ${odd:-none}"
        done
        for v in NEBIUS_API_KEY NEBIUS_PROJECT_ID; do
          if [ -z "${!v}" ]; then
            echo "::error::$v reached the action empty. Add it under Settings > Secrets and variables > Actions > Secrets > Repository secrets (not Variables, not Codespaces/Dependabot secrets) and pass it to the action as secrets.$v. PRs from forks never get secrets."
            exit 2
          fi
        done
        mkdir -p .doppel/out
        BASE=".doppel/base/${{ inputs.app-dir }}"
        HEAD=".doppel/head/${{ inputs.app-dir }}"
        printf '# %s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > .doppel/out/PR.md
        # doppel check: test mode always (the app's own tests, no setup); the guided twin too when the repo
        # has a doppel.toml. Personas come from the base branch only: a PR must not choose the users that test it
        PERSONAS="$BASE/${{ inputs.personas }}"
        ARGS=(--backend nebius --base "$BASE" --head "$HEAD" -n "${{ inputs.personas-count }}" --strict
              --app "${{ github.event.repository.name }}"
              --out .doppel/out/report.md --json .doppel/out/check.json --twin-json .doppel/out/run.json)
        if [ -f "$PERSONAS" ]; then ARGS+=(--personas "$PERSONAS"); fi
        if [ "${{ inputs.judge }}" = "true" ]; then ARGS+=(--pr .doppel/out/PR.md); fi
        if [ "${{ inputs.guided }}" != "true" ]; then ARGS+=(--no-guided); fi
        if [ "${{ inputs.twin }}" = "off" ]; then ARGS+=(--no-twin); fi
        doppel check "${ARGS[@]}" 2>&1 | tee .doppel/out/doppel.log
        code=${PIPESTATUS[0]}
        if [ ! -f .doppel/out/report.md ]; then
          # Doppel stopped before writing a report: the comment still says so, with the end of the log
          # (secret values replaced: a comment isn't masked the way the job log is)
          python - <<'PY'
        import os, pathlib
        text = pathlib.Path(".doppel/out/doppel.log").read_text("utf-8", "replace")
        for name in ("NEBIUS_API_KEY", "NEBIUS_PROJECT_ID"):
            if os.environ.get(name):
                text = text.replace(os.environ[name], "***")
        tail = "\n".join(text.splitlines()[-25:]).replace("```", "'''") or "(no output)"
        pathlib.Path(".doppel/out/report.md").write_text(
            "## Doppel: couldn't check this PR\n\nDoppel stopped before it could compare the two versions. "
            "The end of its log:\n\n```\n" + tail + "\n```\n", encoding="utf-8")
        PY
        fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        [ -f .doppel/out/report.md ] && cat .doppel/out/report.md >> "$GITHUB_STEP_SUMMARY"
        [ -f .doppel/out/run.json ] && doppel view .doppel/out/run.json --no-open --out .doppel/out/doppel-run.html || true
        [ -f .doppel/out/check.json ] && doppel view .doppel/out/check.json --no-open --public \
          --out .doppel/out/doppel-check.html || true
        if [ "$code" -gt 1 ]; then
          # couldn't compare is no verdict either way: by default it warns instead of failing the PR
          [ "$FAIL_ON_ERROR" = "true" ] && exit "$code"
          echo "::warning title=Doppel::Doppel couldn't check this pull request; the reason is in the PR comment. This doesn't fail the check (fail-on-error: true makes it fail)."
        fi
    - name: Check for the accept label
      id: accept
      if: always() && steps.run.outputs.exit-code == '1'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LABEL: ${{ inputs.accept-label }}
      run: |
        # read from the PR now, not from the event: a re-run carries the first run's event, which doesn't have
        # the label a maintainer added afterwards
        if doppel accepted --label "$LABEL"; then
          echo "accepted=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=Doppel::A maintainer accepted these findings with the label '$LABEL'; the check passes."
        fi
    - name: Publish the check page
      id: page
      if: always() && inputs.publish-page == 'true' && hashFiles('.doppel/out/doppel-check.html') != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        # the page goes to this repo's GitHub Pages (gh-pages branch), so the PR comment can link to it.
        # Anything that stops it (no write permission, a fork, Pages off) falls back to the artifacts link.
        set +e
        REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        rm -rf .doppel/pages
        if ! git clone -q --depth 1 --branch gh-pages "$REMOTE" .doppel/pages 2>/dev/null; then
          mkdir -p .doppel/pages && git -C .doppel/pages init -q && git -C .doppel/pages checkout -q -b gh-pages \
            && git -C .doppel/pages remote add origin "$REMOTE"
        fi
        DIR=".doppel/pages/doppel/pr-${PR:-manual}"
        mkdir -p "$DIR" && cp .doppel/out/doppel-check.html "$DIR/index.html"
        [ -f .doppel/out/doppel-run.html ] && cp .doppel/out/doppel-run.html "$DIR/replay.html"
        touch .doppel/pages/.nojekyll
        cd .doppel/pages
        git -c user.name="doppel" -c user.email="doppel@users.noreply.github.com" add -A
        # no "#N" in the message: GitHub would link it to the PR and add a timeline entry on every run
        git -c user.name="doppel" -c user.email="doppel@users.noreply.github.com" commit -qm "Doppel check page, pull request ${PR}"
        if git push -q origin gh-pages 2>/dev/null; then
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          URL="https://${OWNER,,}.github.io/${REPO}/doppel/pr-${PR:-manual}/"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo -e "\n**[Open the full check page →]($URL)** (ready about a minute after the run)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::notice::Doppel could not publish the check page (needs 'contents: write' and GitHub Pages on the gh-pages branch); it is in the run artifacts."
        fi
        exit 0
    - name: Comment on the PR
      if: always() && hashFiles('.doppel/out/report.md') != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PAGE: ${{ steps.page.outputs.url }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        CODE: ${{ steps.run.outputs.exit-code }}
        ACCEPTED: ${{ steps.accept.outputs.accepted }}
        LABEL: ${{ inputs.accept-label }}
        FAILS: ${{ inputs.fail-on-regression }}
      run: |
        NOTE=""
        if [ "$ACCEPTED" = "true" ]; then
          NOTE="✅ **Accepted by a maintainer:** this PR has the label \`$LABEL\`, so these findings don't fail the check. Removing the label makes them fail it again."$'\n\n'
        elif [ "$CODE" = "1" ] && [ "$FAILS" = "true" ]; then
          NOTE="If these changes are what you want, a maintainer can add the label \`$LABEL\` and re-run this check: it then passes, and this comment keeps the findings."$'\n\n'
        fi
        if [ -n "$PAGE" ]; then
          FOOT="**[Open the full check page →]($PAGE)** · ready about a minute after this comment"
        else
          FOOT="The full check page (doppel-check.html) is in the [run artifacts]($RUN)."
        fi
        FOOT="$NOTE$FOOT"$'\n\n'"<sub>Raw recordings: [run artifacts]($RUN)</sub>"
        doppel comment --report .doppel/out/report.md --footer "$FOOT"
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: doppel-report
        path: .doppel/out/
        if-no-files-found: ignore
    - name: Fail on regressions
      if: steps.run.outputs.exit-code == '1' && inputs.fail-on-regression == 'true' && steps.accept.outputs.accepted != 'true'
      shell: bash
      env:
        PAGE: ${{ steps.page.outputs.url }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        # one line a reviewer can act on, as an error annotation (shown on the run's summary, not only in this log)
        N=$(python -c "import json; print(json.load(open('.doppel/out/check.json')).get('regressions', 0))" 2>/dev/null || echo "")
        WHAT="${N:-Some} regression$([ "$N" = "1" ] || echo s) the PR doesn't mention"
        WHERE="${PAGE:-the PR comment and the run artifacts ($RUN)}"
        echo "::error title=Doppel::$WHAT. See $WHERE"
        exit 1
