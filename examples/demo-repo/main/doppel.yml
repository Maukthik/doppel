# Copy to .github/workflows/doppel.yml in the demo repo.
name: doppel
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  twin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: Maukthik/doppel@main
        with:
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          nebius-project-id: ${{ secrets.NEBIUS_PROJECT_ID }}
