name: Try Doppel
description: Paste a public pull request. Doppel compares the code before and after it and replies here.
title: "Try: "
labels: ["try"]
body:
  - type: markdown
    attributes:
      value: |
        Doppel installs the app, runs its own tests on the code **before and after** the pull request in Nebius
        sandboxes, records every response, and reports what changed that the PR's description doesn't mention.
        The reply appears on this issue in 1 to 5 minutes.

        **Examples** that show each outcome:
        - `https://github.com/Maukthik/doppel-demo/pull/1` says it documents a field; it leaks every password hash.
        - `https://github.com/Maukthik/doppel-demo/pull/2` says it tidies error handlers; it renames an error field.
        - `https://github.com/Maukthik/doppel-demo/pull/3` only changes docstrings, and says so.
  - type: input
    id: pr
    attributes:
      label: Pull request link
      placeholder: https://github.com/owner/repo/pull/123
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **What works here:** public Python web apps (Flask, Django, FastAPI and similar) whose tests run from
        `tox.ini`, a CI workflow, a Makefile or a noxfile. This page runs test mode only; the guided twin needs a
        `doppel.toml` in the repo, see [Setting up the twin](https://github.com/Maukthik/doppel#setting-up-the-twin).
        Runs are public, and limited per day, because each one uses real sandboxes.
