name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: offline tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (local twin, no secrets, no network)
        run: python -m pytest -q
      - name: Twin report on the shop example
        run: doppel run --base examples/shop/base --head examples/shop/head --personas examples/shop/personas.json --out report.md
      - name: Show the report on the run page
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"
