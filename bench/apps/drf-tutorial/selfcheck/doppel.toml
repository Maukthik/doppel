# Hand-written, ONLY for `generality.py selfcheck` (testing the harness and the patches).
# Benchmark results always use the setup `doppel init` writes to ../generated/.
[app]
install = "pip install --quiet djangorestframework dj-database-url pygments drf-spectacular markdown inflection whitenoise"
start = "python manage.py runserver 127.0.0.1:$PORT --noreload"
ready = "/"
seed = "python manage.py migrate --noinput -v 0 && python doppel_seed.py"
