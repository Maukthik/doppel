[app]
image = "python:3.12-slim"
install = "pip install --quiet 'flask'"
start = "flask --app flaskr run --host 0.0.0.0 --port $PORT"
ready = "/hello"
seed = "mkdir -p instance && flask --app flaskr init-db && python doppel_seed.py"
migrate = ""
env = { FLASK_APP = "flaskr", DATABASE = "instance/flaskr.sqlite" }
[personas]
guide = "Log in with username 'alice' and password 'doppel-pass'. The seeded users are alice, bob, and charlie, all with password 'doppel-pass'. There are 10 posts created by these users."
[personas.login]
method = "POST"
path = "/auth/login"
form = { username = "alice", password = "doppel-pass" }
[diff]
ignore = []
slow_ratio = 3.0
slow_min_ms = 400
