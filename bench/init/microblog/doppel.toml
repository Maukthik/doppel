[app]
image = "python:3.12-slim"
install = "pip install --quiet 'alchemical==1.0.2' 'alembic==1.13.2' 'apifairy==1.4.0' 'apispec==6.6.1' 'blinker==1.8.2' 'certifi==2024.7.4' 'charset-normalizer==3.3.2' 'click==8.1.7' 'faker==26.0.0' 'flask==3.0.3' 'flask-cors==4.0.1' 'flask-httpauth==4.8.0' 'flask-mail==0.10.0' 'flask-marshmallow==1.2.1' 'flask-sqlalchemy==3.1.1' 'greenlet==3.0.3' 'gunicorn==22.0.0' 'idna==3.7' 'itsdangerous==2.2.0' 'jinja2==3.1.4' 'mako==1.3.5' 'markupsafe==2.1.5' 'marshmallow==3.21.3' 'marshmallow-sqlalchemy==1.0.0' 'packaging==24.1' 'pyjwt==2.8.0' 'python-dateutil==2.9.0.post0' 'python-dotenv==1.0.1' 'requests==2.32.3' 'six==1.16.0' 'sqlalchemy==2.0.31' 'typing-extensions==4.12.2' 'urllib3==2.2.2' 'webargs==8.4.0' 'werkzeug==3.0.3'"
start = "gunicorn -b 0.0.0.0:$PORT --access-logfile - --error-logfile - microblog:app"
ready = "/docs"
seed = "mkdir -p instance && alembic upgrade head && python doppel_seed.py"
migrate = "alembic upgrade head"
env = { DATABASE_URL = "sqlite:///instance/db.sqlite", SECRET_KEY = "top-secret!", DISABLE_AUTH = "", MAIL_SERVER = "", MAIL_PORT = "", MAIL_USE_TLS = "", MAIL_USERNAME = "", MAIL_PASSWORD = "", MAIL_DEFAULT_SENDER = "", PASSWORD_RESET_URL = "http://localhost:3000/reset", ACCESS_TOKEN_MINUTES = "15", REFRESH_TOKEN_DAYS = "7", REFRESH_TOKEN_IN_COOKIE = "true", REFRESH_TOKEN_IN_BODY = "false", RESET_TOKEN_MINUTES = "15", USE_CORS = "true", APIFAIRY_UI = "elements", DOCS_UI = "elements", SQL_ECHO = "" }
[personas]
guide = "Log in with HTTP Basic Auth using username 'alice' or 'bob' and password 'doppel-pass' to get a Bearer token from POST /api/tokens. Use the returned access_token as 'Authorization: Bearer <token>' for authenticated endpoints like GET /api/me. Seeded users: alice, bob, charlie (all password 'doppel-pass'). Seeded posts: 10 posts by alice, bob, charlie."
[personas.login]
method = "POST"
path = "/api/tokens"
auth = ["alice", "doppel-pass"]
save = { token = "access_token" }
header = { Authorization = "Bearer {token}" }
[diff]
ignore = ["access_expiration", "access_token", "after", "avatar_url", "count", "first_seen", "followers_count", "followers_url", "following_count", "following_url", "id", "last_seen", "limit", "offset", "posts_url", "refresh_expiration", "refresh_token", "timestamp", "total", "url"]
slow_ratio = 3.0
slow_min_ms = 400
