# Twin spec for sissbruecker/linkding (Django + DRF, SQLite)
[app]
image = "python:3.13-slim"
install = "pip install --quiet 'django>=6.0.7' djangorestframework beautifulsoup4 bleach bleach-allowlist huey markdown mozilla-django-oidc requests waybackpy"
start = "env LD_DISABLE_BACKGROUND_TASKS=True DJANGO_SETTINGS_MODULE=bookmarks.settings.dev python manage.py runserver 0.0.0.0:$PORT --noreload"
ready = "/health"
seed = "mkdir -p data && env LD_DISABLE_BACKGROUND_TASKS=True DJANGO_SETTINGS_MODULE=bookmarks.settings.dev python manage.py migrate --verbosity 0 && env LD_DISABLE_BACKGROUND_TASKS=True DJANGO_SETTINGS_MODULE=bookmarks.settings.dev python doppel_seed.py"
migrate = "env LD_DISABLE_BACKGROUND_TASKS=True DJANGO_SETTINGS_MODULE=bookmarks.settings.dev python manage.py migrate --verbosity 0"

[personas]
guide = """Every /api route needs the header "Authorization: Token aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
(user alice); bob uses "Token bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb". When creating bookmarks with
POST /api/bookmarks/, add ?disable_scraping to the path so the app does not fetch the web page."""

[personas.login]
method = "GET"
path = "/api/user/profile/"
header = { Authorization = "Token aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }

[diff]
ignore = []
slow_ratio = 3.0
slow_min_ms = 400
