[app]
image = "python:3.13-slim"
install = "pip install --quiet 'beautifulsoup4>=4.14.3' 'bleach>=6.4.0' 'bleach-allowlist>=1.0.3' 'django>=6.0.7' 'djangorestframework>=3.16.1' 'huey>=2.5.5' 'markdown>=3.10' 'mozilla-django-oidc>=5.0.2' 'requests>=2.33.0' 'supervisor>=4.3.0' 'waybackpy>=3.0.6'"
start = "mkdir -p data data/assets data/favicons data/previews && python manage.py generate_secret_key && python manage.py migrate && python manage.py enable_wal && python manage.py runserver 0.0.0.0:$PORT"
ready = "/health"
seed = "mkdir -p data data/assets data/favicons data/previews && python manage.py migrate && python doppel_seed.py"
migrate = "python manage.py migrate"
env = { DJANGO_SETTINGS_MODULE = "bookmarks.settings.dev", LD_DB_ENGINE = "sqlite", LD_DB_DATABASE = "linkding", LD_CONTEXT_PATH = "", LD_DISABLE_BACKGROUND_TASKS = "True", LD_DISABLE_URL_VALIDATION = "True", LD_ENABLE_OIDC = "False", LD_ENABLE_AUTH_PROXY = "False", LD_DISABLE_LOGIN_FORM = "False", LD_CSRF_TRUSTED_ORIGINS = "", LD_CORS_ALLOWED_ORIGINS = "", LD_DB_OPTIONS = "{}", TZ = "UTC", LD_SESSION_COOKIE_AGE = "1209600", LD_FAVICON_PROVIDER = "https://t1.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url={url}&size=32", LD_DEFAULT_FAVICON_PROVIDER = "https://t1.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url={url}&size=32", LD_FAVICON_FOLDER = "data/favicons", LD_ENABLE_REFRESH_FAVICONS = "False", LD_PREVIEW_FOLDER = "data/previews", LD_ASSET_FOLDER = "data/assets", LD_ENABLE_SNAPSHOTS = "False", LD_DISABLE_ASSET_UPLOAD = "True", LD_SERVER_HOST = "0.0.0.0", LD_SERVER_PORT = "8000" }
[personas]
guide = "Log in with username 'doppel' and password 'doppel-pass'. The API uses token authentication: include header 'Authorization: Token aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' (40 'a's) for the seeded user 'doppel'. Seeded users: doppel, alice, bob. Seeded bookmarks: 10 bookmarks across these users with tags like 'tech', 'news', 'dev'."
[personas.login]
method = "GET"
path = "/api/user/profile/"
header = { Authorization = "Token aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
[diff]
ignore = ["action_url", "asset_type", "assets", "bookmark_date_display_absolute", "bookmark_date_display_hidden", "bookmark_date_display_relative", "bookmark_description_display_inline", "bookmark_description_display_separate", "bookmark_link_target_blank", "close_url", "content_type", "created", "css_classes", "date_accessed", "date_added", "date_created", "date_modified", "delete_url", "display_name", "edit_return_url", "favicon_url", "file", "file_size", "has_pending_assets", "icon_classes", "id", "key", "latest_snapshot", "preview_image_enabled", "preview_image_url", "sharing_enabled", "show_link_icons", "snapshot_title", "snapshot_url", "snapshots_enabled", "status", "tag_names", "text_classes", "uploads_enabled", "web_archive_integration_enabled", "web_archive_snapshot_url", "website_description", "website_title"]
slow_ratio = 3.0
slow_min_ms = 400
