# isso settings for Doppel's twin (not for production)
[general]
dbpath = /var/lib/isso-doppel/comments.db
host = http://localhost/
notify = stdout
reply-notifications = false
latest-enabled = true

[admin]
enabled = false

[moderation]
enabled = false

[guard]
# off: Doppel's users all come from one address, and isso would rate-limit them as one visitor
enabled = false

[hash]
salt = doppel-twin-fixed-salt
algorithm = pbkdf2
