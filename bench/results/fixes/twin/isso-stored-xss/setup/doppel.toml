# Doppel twin spec for isso-comments/isso, written by hand the way the app's maintainer would (once, not per PR).
# `doppel init` could not set isso up on its own (it runs from a config file and needs a compiled Markdown
# library); see bench/results/fixes/twin/README.md.
[app]
image = "python:3.12-slim"
install = "pip install --quiet --disable-pip-version-check -e ."
start = "mkdir -p /var/lib/isso-doppel && python doppel_isso.py"   # serves isso on $PORT
ready = "/info"
seed_requests = "doppel_seed.json"   # two threads and a reply, posted through isso's own API

[personas]
guide = """isso is a comment server for blogs. Send JSON with "Content-Type: application/json".
POST /new?uri=<page path> creates a comment: {"text": ... (at least 3 characters), "author": ..., "email": ..., "website": ... (a URL),
"title": ...}; "title" is needed for a page that has no comments yet; "parent": <id> makes it a reply. The
answer is the comment, and isso sets a cookie that lets the same user edit or delete it: PUT /id/<id>
with {"text": ..., "author": ..., "website": ...}, DELETE /id/<id>. GET /?uri=<page path> lists a page's
comments, GET /id/<id> shows one, POST /count with a JSON list of page paths counts them, GET /latest?limit=5
lists the newest, POST /id/<id>/like and /dislike vote. Seeded pages: /blog/hello-world (comments 1 and 3)
and /blog/second-post (comment 2)."""

[diff]
# set from the clock on every run
ignore = ["created", "modified"]
slow_ratio = 3.0
slow_min_ms = 400
